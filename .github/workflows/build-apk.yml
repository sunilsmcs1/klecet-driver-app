# Builds the driver APK in the cloud on every push. Download it from the run's "Artifacts".
name: Build driver APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Create Android project files
        run: flutter create --org in.klecet --platforms=android --project-name klecet_driver .
      - name: Use our Android manifest (permissions for background GPS)
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: klecet-driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk
