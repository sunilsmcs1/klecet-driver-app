name: klecet_driver
description: KLECET bus tracker - driver app (no login, background GPS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
